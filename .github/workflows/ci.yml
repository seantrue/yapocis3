name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The test suite on yapocis-rs's CPU backend (YAPOCIS_BACKEND=rustcpu), #102.
# Linux only: hosted runners have no GPU, and macOS runners are not used.
# Metal, OpenCL, CUDA and numbax are tested on the maintainer's machines.
# Python: the newest version yapocis supports (pyproject classifiers).

env:
  # The yapocis-rs commit the yapocis_rs wheel is built from. Move it to a
  # merged yapocis-rs commit, never a branch.
  # yapocis-rs #25's merge (hash facade, §3.3): its program-cache key follows commonkit's switch.
  YAPOCIS_RS_REF: e45f6e0e0b5e05ca7760470298308297882381ad
  PYTHON_VERSION: "3.13"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  rustcpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check out yapocis-rs at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: seantrue/yapocis-rs
          ref: ${{ env.YAPOCIS_RS_REF }}
          path: yapocis-rs

      # The yapocis family's shared test environment (yapocis-rs/.github/actions/test-env): uv
      # (cached), maturin, Rust and its build cache for the yapocis_rs wheel, and the system
      # packages.
      - uses: seantrue/yapocis-rs/.github/actions/test-env@main
        with:
          rust-cache-workspaces: yapocis-rs/bindings/python

      - name: Install yapocis and its test dependencies (from uv.lock)
        run: |
          uv venv .venv --python "$PYTHON_VERSION"
          uv sync --locked --no-dev --extra test
          # Used by the test fixtures (performance database, reports); in the
          # dev group, which also pulls in torch, so install just these, at
          # the locked versions.
          uv export --locked --group dev --no-hashes --no-emit-project \
            | grep -E '^(duckdb|tabulate)==' > ci-extra.txt
          uv pip install --python .venv/bin/python -r ci-extra.txt

      - name: Build and install the yapocis_rs wheel
        working-directory: yapocis-rs/bindings/python
        run: |
          maturin build --release -i "$GITHUB_WORKSPACE/.venv/bin/python" --out dist
          # --no-deps: keep the NumPy that uv.lock chose
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --no-deps dist/yapocis_rs-*.whl

      - name: Versions
        run: |
          .venv/bin/python -c "import sys, numpy, yapocis, yapocis_rs; print(sys.version); print('numpy', numpy.__version__); print('yapocis', yapocis.__file__); print('yapocis_rs', yapocis_rs.__file__)"

      # Under b3 (md5 is legacy and not tested), with a fresh store root and mark folder
      # inside a fresh run folder (the commonkit hash facade, §3.3).
      - name: Tests (rustcpu), under b3
        run: |
          for algo in b3; do
            run=$(mktemp -d)
            COMMONKIT_HASH=$algo COMMONKIT_TEST_RUN=$run COMMONKIT_STORE_ROOT=$run/store \
              COMMONKIT_MARK_DIR=$run/marks make test-rustcpu
            if ls "$run/marks" 2>/dev/null | grep -E 'shm_(foreign_digest|bad_key)'; then exit 1; fi
          done

      # Every digest goes through commonkit.digest (D10): ruff's TID251 bans hashlib and
      # blake3, and no source outside tests and hash-allowlist.txt names an algorithm.
      - name: Hash gates
        run: |
          uvx ruff check --select TID251 --extend-exclude yapocis-rs .
          ! git ls-files '*.py' | grep -v '^tests/' | grep -vxF -f hash-allowlist.txt \
            | xargs grep -nE 'hashlib|blake3|fixed\.|build\.both|"md5:|"b3:' 
