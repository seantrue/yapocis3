# pyproject.toml
# Modern Python packaging configuration for yapocis

[project]
name = "yapocis"
version = "0.3.8"
description = "Yet another PyOpenCL interface specifier - Multi-backend GPU/CPU computing framework for image processing"
readme = "README.md"
authors = [
    { name = "Sean D. True", email = "sean.true@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["opencl", "pyopencl", "thunk", "ocl", "image", "gpu", "computing", "metal", "cuda", "numba"]
requires-python = ">=3.10"
# numba and pyopencl are required everywhere; pymetallic on macOS
dependencies = [
    # Core dependencies - always required
    "Mako>=1.3.0",
    "Pillow>=10.3.0",
    "numpy>=2.1.0",
    "pyyaml>=6.0.0",
    "pyparsing>=3.2.0",
    "scikit-image>=0.25.0",
    "imagecodecs>=2024.1.1",  # imread: compressed (e.g. LZW) TIFFs
    "freetype-py>=2.5.0",
    "pyopencl>=2025.2.6",
    "numba>=0.62.1",
    "pymetallic; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/seantrue/Yapocis3/"
Documentation = "https://yapocis.readthedocs.io/"
Repository = "https://github.com/seantrue/Yapocis3.git"
"Bug Tracker" = "https://github.com/seantrue/Yapocis3/issues"
Changelog = "https://github.com/seantrue/Yapocis3/blob/main/CHANGELOG.md"


[project.optional-dependencies]
# Backend-specific dependencies. pyopencl, numba (and pymetallic on macOS) are core dependencies; their
# extras remain so `--extra opencl` / `--extra numba` keep working.
opencl = [
    "pyopencl>=2025.2.6",
]
metal = [
    "pymetallic; sys_platform == 'darwin'",
]
cuda = [
    "pycuda>=2025.1.2",
]
numba = [
    "numba>=0.62.1",
]

# matplotlib backend (yapocis.lib.mplbackend)
mpl = [
    "matplotlib>=3.7.0",
    "mapbox-earcut>=1.0.0",
]

# Combined backend groups. Metal installs only on macOS; CUDA needs a CUDA
# toolkit to build pycuda, so it is opt-in through cuda / linux-backends.
all-backends = [
    "yapocis[opencl,metal,numba]",
]
mac-backends = [
    "yapocis[opencl,metal,numba]",
]
linux-backends = [
    "yapocis[opencl,cuda,numba]",
]

# Testing dependencies
test = [
    "yapocis[mpl]",
    "pytest>=7.4.0",
    "pytest-cov>=3.0.0",
    "pytest-benchmark>=3.4.0",
    "pytest-durations",
    "seaborn>=0.12.0",
    "scipy>=1.11.0",
]

# Development dependencies
dev = [
    "yapocis[test,docs]",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pyrefly>=0.45.1",
    "ty>=0.0.1a33",
    "licensecheck>=2025.1.0",
    "pip-tools>=7.0.0",
    "tabulate>=0.9.0",
    "duckdb>=1.1.0",
    "pygame>=2.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "wheel>=0.37.0",
    "watchdog>=4.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Documentation dependencies
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autobuild>=2024.0.0",
    "sphinx-autoapi>=3.0.0",
]

mac-dev = [
    "yapocis[mac-backends,dev,docs]",
]

linux-dev = [
    "yapocis[linux-backends,dev,docs]",
]

[project.scripts]
# Unified development tools CLI
yapocis-tools = "yapocis.scripts.tools:main"

# Specialized tools
yapocis-imagewatcher = "yapocis.scripts.imagewatcher:main"
yapocis-queue = "yapocis.scripts.queue_check:main"
yapocis-report = "yapocis.scripts.report:main"
yapocis-validate = "yapocis.scripts.validate:main"
yapocis-performance = "yapocis.scripts.performance:main"
yapocis-cuda-cards = "yapocis.scripts.cuda_cards:main"
yapocis-doctest = "yapocis.scripts.doctest_examples:main"

[build-system]
requires = ["hatchling>=1.13"]
build-backend = "hatchling.build"

[dependency-groups]
# The dev extra is the single list; `uv sync --group dev` installs it
dev = [
    "yapocis[dev]",
]

[tool.uv]
# Minimum versions for transitive dependencies: security fixes (requests,
# certifi, idna, Jinja2, Pygments) and the pytools that pyopencl/pycuda need.
constraint-dependencies = [
    "requests>=2.32.4",
    "certifi>=2024.7.4",
    "idna>=3.7",
    "Jinja2>=3.1.6",
    "Pygments>=2.15.1",
    "pytools>=2025.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yapocis"]
include = [
    "src/yapocis/**/*.interface",
    "src/yapocis/**/*.mako",
    "src/yapocis/**/*.cl",
    "src/yapocis/**/*.ttf",
    "src/yapocis/**/test.jpg",
    "src/yapocis/**/test.txt",
]
exclude = [
    "src/yapocis/models/**/*.npz",
    "src/yapocis/models/**/*.onnx",
    "src/yapocis/models/**/*.pth",
    "src/yapocis/models/**/*.pt",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/yapocis/models/**/*.npz",
    "src/yapocis/models/**/*.onnx",
    "src/yapocis/models/**/*.pth",
    "src/yapocis/models/**/*.pt",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | external
  | claude-debug
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "B904", # raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are expected
"tests/*" = ["B011"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "pyopencl.*",
    "pymetallic.*",
    "pycuda.*",
    "numba.*",
    "mako.*",
    "mapbox_earcut.*",
    "freetype.*",
    "skimage.*",
    "pygame.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
markers = [
    "ocl: marks tests for OpenCL backend",
    "metal: marks tests for Metal backend",
    "cuda: marks tests for CUDA backend",
    "numba: marks tests for Numba backend",
    "validation: marks tests that use validation framework",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU hardware",
]

[tool.coverage.run]
source = ["src/yapocis"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/external/*",
    "*/claude-debug/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if self.debug:",
    "if settings.DEBUG",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.cibuildwheel]
before-all = "uname -a"

[tool.twine]
repository = "pypi"
sign = false
skip-existing = false
verify-ssl = true
